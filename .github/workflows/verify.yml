name: verify
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python verification/verify.py --root 1acdd256c9e889ee5d95871c1e9228907d71c6aeaccf9eab353a465f3716c9b2
      - run: python verification/selftest.py
