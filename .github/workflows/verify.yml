name: verify
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python verification/verify.py --root 05dd1bc5403a381e3f5c36335b97b8c6417fcd36c4611acddab81ecd7f8a0d40
      - run: python verification/selftest.py
